name: Monastic Visitation CI Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monastic-gate:
    name: Pre-Visitation Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Enforce AGENTS.md Word Count (< 1500 words)
        run: |
          if [ -f "AGENTS.md" ]; then
            WORDS=$(wc -w < AGENTS.md)
            echo "AGENTS.md word count: $WORDS"
            if [ "$WORDS" -gt 1500 ]; then
              echo "❌ Error: AGENTS.md exceeds 1500 words ($WORDS). Prune volatile facts to prevent prompt rot."
              exit 1
            fi
            echo "✅ AGENTS.md rule length verified."
          else
            echo "❌ Error: AGENTS.md not found in root."
            exit 1
          fi

      - name: Static Lint & Typecheck
        run: npm run lint

      - name: Deterministic Test Suite (100% Green)
        run: npm run test

      - name: Production Build Check
        run: npm run build --if-present
